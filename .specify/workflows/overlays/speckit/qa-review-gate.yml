id: qa-review-gate
extends: speckit
priority: 10
enabled: true
edits:
- insert_after: tasks
  step:
    id: qa-review
    type: gate
    message: "QA review gate \u2014 hand spec.md, plan.md, and tasks.md to the qa-reviewer\
      \ persona before implementation. Reviewer must confirm: (a) every spec.md acceptance\
      \ criterion maps to at least one task, (b) every task has a verifiable done-condition,\
      \ (c) risky/destructive steps include rollback or verification notes. On FAIL\
      \ or PASS-WITH-CAVEATS, revise the plan/tasks and re-review. Approve only on\
      \ explicit QA sign-off."
    options:
    - approve
    - reject
    on_reject: abort

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "copilot/**"

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu Python 3.13
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          python -m pip install -r requirements.txt
          python -m pip install .
      - name: Run tests
        run: python -m pytest src/mega/tests src/v4_pipeline/tests src/mom/tests src/budget_api/tests -q

  windows:
    name: Windows Python 3.13
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          python -m pip install pytest pytest-asyncio
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          python -m pip install -r requirements.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          python -m pip install .
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest src/mega/tests src/v4_pipeline/tests src/mom/tests src/budget_api/tests -m "not pdf_renderer" -q
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

  client:
    name: Client build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: client
        run: pnpm build
      - name: Test
        working-directory: client
        run: pnpm test
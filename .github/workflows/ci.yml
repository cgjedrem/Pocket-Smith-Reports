name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "copilot/**"

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu Python 3.13
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          python -m pip install -r requirements.txt
          python -m pip install .
      - name: Run tests
        run: python -m pytest src/mega/tests src/v4_pipeline/tests src/mom/tests src/budget_api/tests -q

  windows:
    name: Windows Python 3.13
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          python -m pip install pytest pytest-asyncio
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          python -m pip install -r requirements.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          python -m pip install .
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest src/mega/tests src/v4_pipeline/tests src/mom/tests src/budget_api/tests -m "not pdf_renderer" -q
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }